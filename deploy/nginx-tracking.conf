# Para VPS que já usa Nginx (ex.: o CRM). Copie para
# /etc/nginx/sites-available/tracking, troque o domínio e depois:
#   sudo ln -s /etc/nginx/sites-available/tracking /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tracking.seudominio.com
server {
    listen 80;
    server_name tracking.seudominio.com;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
